[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stoopcraft-outreach"
version = "1.0.0"
description = "StoopCraft automated prospecting, website-redesign and cold-outreach system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "StoopCraft" }]

dependencies = [
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "playwright>=1.44",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4.8",
    "mypy>=1.10",
    "types-beautifulsoup4",
]

[project.scripts]
outreach = "outreach.cli.main:app"

[tool.setuptools.packages.find]
include = ["outreach*"]

[tool.setuptools.package-data]
outreach = [
    "templates/**/*",
    "fixtures/**/*",
    "ai/prompts/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that touch real external services (never run by default)",
    "browser: tests that require a working Playwright Chromium install",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001: scraped page text genuinely contains en dashes and curly quotes,
# and the patterns that match them must contain them too.
ignore = ["E501", "B008", "RUF012", "SIM108", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
exclude = ["migrations/", "tests/", "\\.venv/"]
check_untyped_defs = true
